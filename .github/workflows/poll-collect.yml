name: poll-collect
on:
  schedule:
    - cron: '*/30 * * * *'   # 30분마다 수집
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore store cache
        uses: actions/cache@v4
        with:
          path: store.json
          key: store-${{ github.run_id }}
          restore-keys: store-
      - name: Collect
        run: python collect.py
      - name: Save store cache
        uses: actions/cache/save@v4
        with:
          path: store.json
          key: store-${{ github.run_id }}
